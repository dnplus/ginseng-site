name: CI

# Every pull request: typecheck, unit tests, a production build and the smoke test against it (local D1 only).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Local D1 and env for the smoke test
        run: |
          cp .dev.vars.example .dev.vars
          pnpm db:migrate
      - run: pnpm build
      - name: Smoke test the built Worker
        run: |
          pnpm preview > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:5173/ && break; sleep 1; done
          pnpm test:smoke || { cat preview.log; exit 1; }
