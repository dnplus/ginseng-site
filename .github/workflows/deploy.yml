name: Deploy

# main is production: every push runs the same checks as pull requests, applies new D1 migrations, then deploys.
# Needs the repository secret CLOUDFLARE_API_TOKEN (see README "自動部署"). The account id comes from wrangler.jsonc.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in push order; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ginseng.dnplus.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the deploy token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (README, 自動部署)."
            exit 1
          fi
      # Migrations first: the new code may read columns they add. They only add columns and tables, so the
      # still-running old version keeps working in between.
      - name: Apply D1 migrations
        run: pnpm db:migrate:remote
      - name: Build and deploy
        run: pnpm run deploy
      - name: Check the live site
        run: |
          for path in / /en /blog /newsletter /brand/footer.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://ginseng.dnplus.dev$path")
            echo "$path $code"; test "$code" = 200
          done
